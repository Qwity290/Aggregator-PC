name: Auto Update PC Prices

on:
  schedule:
    - cron: '0 9 * * *' # Автоматический запуск 1 раз в сутки (в 12:00 по Москве)
  workflow_dispatch:     # Ручной запуск по кнопке в любой момент

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем файлы репозитория
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запускаем парсер цен через ScraperAPI
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python parser.py

      - name: Сохраняем обновленный prices.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Price Bot"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление цен через API" && git push)

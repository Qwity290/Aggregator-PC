  max-width: 850px;
  margin: 40px auto;
  padding: 0 20px;
}
h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; }
.search-box { display: flex; gap: 10px; margin-bottom: 15px; }
input[type="text"] {
  flex: 1; padding: 12px 15px; font-size: 16px;
  border: 2px solid #ddd; border-radius: 8px; outline: none;
}
input[type="text"]:focus { border-color: #3498db; }
button.search-btn {
  padding: 12px 25px; font-size: 16px; background: #3498db;
  color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
}
button.search-btn:hover { background: #2980b9; }
.quick-tags {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 25px; align-items: center;
}
.quick-tags span { font-size: 13px; color: #7f8c8d; }
.tag-btn {
  background: #e1e8ed; color: #2c3e50; border: none;
  padding: 5px 12px; border-radius: 15px; font-size: 13px; cursor: pointer;
}
.tag-btn:hover { background: #3498db; color: white; }

.min-price-banner {
  background: linear-gradient(135deg, #27ae60, #2ecc71);
  color: white; padding: 16px 22px; border-radius: 10px; margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
}
.min-price-banner .big-price { font-size: 24px; font-weight: bold; }

.card {
  background: white; padding: 20px; margin-bottom: 15px;
  border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  display: flex; justify-content: space-between; align-items: center; gap: 15px;
}
.card.out-of-stock { background-color: #fafafa; opacity: 0.85; }
.shop-badge {
  display: inline-block; padding: 4px 10px; border-radius: 5px;
  font-size: 12px; font-weight: bold; color: white; margin-bottom: 6px;
}
.DNS { background-color: #fc8507; }
.Ozon { background-color: #005bff; }
.Онлайн { background-color: #5c2d91; }
.Яндекс { background-color: #fc3f1d; }

.price { font-size: 22px; font-weight: bold; color: #27ae60; white-space: nowrap; }
.no-stock-text { font-size: 17px; font-weight: bold; color: #e74c3c; white-space: nowrap; }
.buy-btn {
  display: inline-block; margin-top: 8px; padding: 8px 15px;
  background: #ecf0f1; color: #2c3e50; text-decoration: none;
  border-radius: 5px; font-size: 14px; white-space: nowrap;
}
.buy-btn:hover { background: #bdc3c7; }
</style>

function quickSearch(text) {
  document.getElementById("searchInput").value = text;
  searchProducts();
}

function getShopSearchUrl(shop, text) {
  const encodedText = encodeURIComponent(text);
  const s = "\x2F";
  const q = "\x3F";
  if (shop === "DNS") return "https:" + s + s + "www.dns-shop.ru" + s + "search" + s + q + "q=" + encodedText;
  if (shop === "Ozon") return "https:" + s + s + "www.ozon.ru" + s + "search" + s + q + "text=" + encodedText;
  if (shop === "Онлайн Трейд") return "https:" + s + s + "www.onlinetrade.ru" + s + "sitesearch.html" + q + "query=" + encodedText;
  if (shop === "Яндекс Маркет") return "https:" + s + s + "market.yandex.ru" + s + "search" + q + "text=" + encodedText;
  return "#";
}

let savedEdits = JSON.parse(localStorage.getItem("pc_aggr_edits") || "{}");

function editCardStatus(itemKey, currentShop, currentName) {
  const newPriceStr = prompt(
    "Настройка для " + currentShop + " (" + currentName + "):\n\n" +
    "• Введите актуальную цену цифрами (например: 32500)\n" +
    "• Или введите 0, чтобы поставить статус «Нет в наличии»:"
  );
  if (newPriceStr === null) return;
  const parsedPrice = parseInt(newPriceStr.replace(/\D/g, ""), 10);
  if (isNaN(parsedPrice) || parsedPrice <= 0) {
    savedEdits[itemKey] = { inStock: false, price: 0 };
  } else {
    savedEdits[itemKey] = { inStock: true, price: parsedPrice };
  }
  localStorage.setItem("pc_aggr_edits", JSON.stringify(savedEdits));
  searchProducts();
}

function searchProducts() {
  const rawQuery = document.getElementById("searchInput").value.trim();
  const query = rawQuery.toLowerCase();
  const container = document.getElementById("resultsContainer");
  container.innerHTML = "";
  if (!query) return;

  const allShops = ["DNS", "Ozon", "Яндекс Маркет", "Онлайн Трейд"];
  const matchingItems = productsDB.filter(item => item.name.toLowerCase().includes(query));

  const shopCards = allShops.map(shop => {
    const shopItems = matchingItems.filter(item => item.shop === shop);
    const baseItem = shopItems.at(0);
    const itemName = baseItem ? baseItem.name : ("Комплектующие по запросу «" + rawQuery + "»");
    const searchWord = baseItem ? baseItem.searchWord : rawQuery;
    const itemKey = shop + "_" + query;

    if (savedEdits[itemKey] !== undefined) {
      return {
        key: itemKey, shop: shop, name: itemName, searchWord: searchWord,
        price: savedEdits[itemKey].price, inStock: savedEdits[itemKey].inStock
      };
    }

    const available = shopItems.filter(item => item.inStock && item.price > 0).sort((a, b) => a.price - b.price);
    if (available.length > 0) {
      const best = available.at(0);
      return { key: itemKey, shop: shop, name: best.name, searchWord: best.searchWord, price: best.price, inStock: true };
    } else {
      return { key: itemKey, shop: shop, name: itemName, searchWord: searchWord, price: 0, inStock: false };
    }
  });

  shopCards.sort((a, b) => {
    if (a.inStock && !b.inStock) return -1;
    if (!a.inStock && b.inStock) return 1;
    return a.price - b.price;
  });

  const availableShops = shopCards.filter(card => card.inStock);
  if (availableShops.length > 0) {
    const bestOffer = availableShops.at(0);
    container.innerHTML += 
      '<div class="min-price-banner">' +
        '<div>' +
          '<div style="font-size: 13px; opacity: 0.9;">Лучшая цена по запросу «' + rawQuery + '»</div>' +
          '<div style="font-weight: 500;">Самое выгодное предложение: <b>' + bestOffer.shop + '</b></div>' +
        '</div>' +
        '<div class="big-price">от ' + bestOffer.price.toLocaleString('ru-RU') + ' ₽</div>' +
      '</div>';
  }

  shopCards.forEach(card => {
    const shopClass = card.shop.split(" ").at(0);
    const directUrl = getShopSearchUrl(card.shop, card.searchWord);
    const cardExtraClass = card.inStock ? "" : " out-of-stock";
    const safeName = card.name.replace(/'/g, "");
    
    const rightBlock = card.inStock
      ? '<div class="price">от ' + card.price.toLocaleString('ru-RU') + ' ₽</div>' +
        '<a href="' + directUrl + '" target="_blank" class="buy-btn">Найти в ' + card.shop + ' →</a>'
      : '<div class="no-stock-text">Нет в наличии</div>' +
        '<a href="' + directUrl + '" target="_blank" class="buy-btn">Проверить в ' + card.shop + ' →</a>';

    container.innerHTML += 
      '<div class="card' + cardExtraClass + '">' +
        '<div>' +
          '<span class="shop-badge ' + shopClass + '">' + card.shop + '</span> ' +
          '<button onclick="editCardStatus(\'' + card.key + '\', \'' + card.shop + '\', \'' + safeName + '\')" style="border:none; background:none; color:#95a5a6; cursor:pointer; font-size:12px;" title="Изменить цену или наличие">✏️ Изменить</button>' +
          '<div style="font-size: 18px; font-weight: 500; margin-top:4px;">' + card.name + '</div>' +
        '</div>' +
        '<div style="text-align: right;">' +
          rightBlock +
        '</div>' +
      '</div>';
  });
}
</script>
</body>
</html>
